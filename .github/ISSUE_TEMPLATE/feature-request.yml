name: 功能建议 / Feature request
description: 为 Oneiric 提出新想法。Suggest an idea for Oneiric.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请先搜索已有 issue，避免重复。
        Thanks for the suggestion. Please search existing issues first to avoid duplicates.

        **本项目的一条硬约束**：任何优化都不得改变原版 / 生电（红石、活塞、漏斗、作物）的行为。
        如果你的建议是为了"更快"而牺牲行为一致性，请说明为什么这个行为差异可以被接受。
        **Hard constraint of this project**: no optimization may change vanilla or technical-Minecraft
        (redstone, piston, hopper, crop) behavior. If your idea trades behavior for speed, explain why
        that divergence is acceptable.

  - type: textarea
    id: feature
    attributes:
      label: 你希望添加什么 / What would you like to see
      description: 描述功能本身，以及它解决什么问题。Describe the feature and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 是否影响原版行为 / Does it affect vanilla behavior
      description: |
        会改变游戏行为的，需要说明具体差异；纯性能优化请说明为什么行为不变。
        If it changes behavior, state the exact difference. If it is a pure optimization, explain why behavior is unchanged.

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered

  - type: textarea
    id: extra
    attributes:
      label: 其他 / Anything else
