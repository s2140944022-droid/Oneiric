name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # paperweight 需要 git 命令能直接执行（不是 git.cmd / shell 函数）
      - name: Configure Git identity
        run: |
          git config --global user.email "ci@github-actions"
          git config --global user.name "Oneiric CI"

      - name: Apply server patches
        run: ./gradlew applyServerPatches --stacktrace

      - name: Build
        run: ./gradlew createMojmapPaperclipJar --stacktrace

      - name: Show artifacts
        run: ls -lh build/libs/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oneiric-build
          path: |
            build/libs/Oneiric-V*.jar
          if-no-files-found: error

      # 只有 tag 推送才建 Release，普通 push 只出 artifact
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/Oneiric-V*.jar
          generate_release_notes: true
